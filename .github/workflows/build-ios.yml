
name: Build House Capture iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: apps/house-capture
        run: |
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: apps/house-capture
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -r HouseCapture.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-iPhone
          path: apps/house-capture/HouseCapture.ipa
